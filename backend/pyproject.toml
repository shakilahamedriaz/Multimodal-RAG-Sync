[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multimodal-rag-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",

    # Config & validation
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.2",

    # Cache & job queue
    "redis>=5.0.8",

    # AI / LLM
    "openai>=1.50.0",
    "anthropic>=0.35.0",
    "litellm>=1.48.0",
    "cohere>=5.11.0",

    # Embeddings
    "sentence-transformers>=3.1.0",
    "tiktoken>=0.8.0",

    # Document parsers
    "pymupdf>=1.24.0",
    "python-docx>=1.1.2",
    "pillow>=10.4.0",

    # Sparse retrieval
    "bm25s>=0.2.0",

    # HTTP client
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",

    # Auth & security
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",

    # Rate limiting
    "slowapi>=0.1.9",

    # Logging & observability
    "structlog>=24.4.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ragas>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]
